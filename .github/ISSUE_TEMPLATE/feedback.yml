name: Feedback or bug report
description: Raw feedback from you or a member. The Feedback Triage agent groups it and drafts ideas (you decide which ones go on).
title: "Feedback: "
labels: ["feedback"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened or what do you wish for?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and app version (if known)
      placeholder: "Android 15, v0.3.1"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (for bugs)
