name: agent-release-tag

# Merging a release PR (agent/release-vX.Y.Z) as the approver creates the tag and a GitHub release (gate G5).
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'agent/release-v') &&
      github.event.pull_request.merged_by.login == (vars.APPROVER || github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          version=$(jq -r .version app/package.json)
          tag="v$version"
          notes="docs/releases/$tag.md"
          [ -s "$notes" ] || { echo "::error::$notes is missing"; exit 1; }
          gh release create "$tag" --target "$SHA" --title "$tag" --notes-file "$notes"
